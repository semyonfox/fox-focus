name: fox-focus
services:
  app:
    build: .
    image: ${FOX_FOCUS_IMAGE:-fox-focus-app}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8789
      DATA_DIR: /data
      HERMES_KANBAN_DB: ${HERMES_KANBAN_DB:-}
      HERMES_ACTION_API_URL: ${HERMES_ACTION_API_URL:-}
      HERMES_ACTION_TOKEN_FILE: ${HERMES_ACTION_TOKEN_FILE:-}
      # Setting the host file opts Hermes into its own read/proposal token.
      # The empty default leaves the endpoint protected by owner Basic auth.
      HERMES_STATUS_TOKEN_FILE: ${HERMES_STATUS_TOKEN_FILE_HOST:+/run/secrets/fox-focus/hermes-status-token}
      # OAuth configuration is read from individual read-only files. Keep the
      # host files outside this repository and never mount a whole credential
      # directory such as Hermes's provider state.
      APP_BASE_URL: ${APP_BASE_URL:-}
      GOOGLE_OAUTH_CLIENT_FILE: /run/secrets/fox-focus/google-client.json
      MICROSOFT_OAUTH_CLIENT_FILE: /run/secrets/fox-focus/microsoft-client.json
      OAUTH_TOKEN_KEY_FILE: /run/secrets/fox-focus/token-key
    volumes:
      - focus-data:/data
      # Set HERMES_BOARD_DIR to a board directory to enable the optional feed.
      # The empty default keeps this public Compose file portable.
      - ${HERMES_BOARD_DIR:-./empty-hermes-board}:/hermes/personal-tasks:ro
      # Bind only the three files Fox Focus needs. The safe defaults keep
      # OAuth disabled for a local-only workspace.
      - ${GOOGLE_OAUTH_CLIENT_FILE_HOST:-./empty-oauth/google-client.placeholder}:/run/secrets/fox-focus/google-client.json:ro
      - ${MICROSOFT_OAUTH_CLIENT_FILE_HOST:-./empty-oauth/microsoft-client.placeholder}:/run/secrets/fox-focus/microsoft-client.json:ro
      - ${OAUTH_TOKEN_KEY_FILE_HOST:-./empty-oauth/token-key.placeholder}:/run/secrets/fox-focus/token-key:ro
      - ${HERMES_ACTION_TOKEN_FILE_HOST:-./empty-oauth/token-key.placeholder}:/run/secrets/fox-focus/hermes-action-token:ro
      - ${HERMES_STATUS_TOKEN_FILE_HOST:-./empty-oauth/hermes-status-token.placeholder}:/run/secrets/fox-focus/hermes-status-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8789:8789"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  focus-data:
