name: Test container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test
        run: docker build --tag fox-focus:test .
      - name: Check isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint node fox-focus:test --input-type=module -e '
            import assert from "node:assert/strict";
            import { readdirSync } from "node:fs";
            import { createInitialData } from "./src/model.ts";
            assert.deepEqual(readdirSync("/data"), []);
            assert.deepEqual(readdirSync("/app/server").sort(), [
              "app.ts",
              "hermes.ts",
              "index.ts",
              "integrations.ts",
              "oauth.ts",
              "providers.ts",
              "push.ts",
              "store.ts",
              "task-management.ts",
            ]);
            assert.deepEqual(createInitialData(), {
              tasks: [],
              events: [],
              inboxItems: [],
              reminders: [],
              listAreas: {},
            });
          '
          docker run --detach --name fox-focus-check --network none fox-focus:test
          trap 'docker rm --force fox-focus-check >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec fox-focus-check node --input-type=module -e '
              import assert from "node:assert/strict";
              assert.equal((await fetch("http://127.0.0.1:8789/healthz")).status, 200);
              for (const path of ["/", "/app", "/api/v1/workspace", "/api/v1/hermes", "/api/v1/integrations", "/api/v1/task-status"]) {
                assert.equal((await fetch(`http://127.0.0.1:8789${path}`, { redirect: "manual" })).status, 401);
              }
            ' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Container did not become healthy with protected workspace routes.' >&2
          exit 1
